name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  # The conformance cases are generated by Python Lark. This checks that the checked-in cases are exactly what
  # Lark 1.3.1 produces, so no port can "fix" a failing case by editing its expected result.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Lark
        run: |
          pip install lark==1.3.1
          pip download lark==1.3.1 --no-deps --no-binary :all: --dest "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP/lark-1.3.1.tar.gz" --directory "$RUNNER_TEMP"

      - name: Regenerate the conformance cases
        run: |
          python conformance/tools/extract_upstream.py "$RUNNER_TEMP/lark-1.3.1"
          python conformance/tools/generate.py

      - name: Check that the cases are up to date
        run: git diff --exit-code -- conformance

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore EtAlii.Lark.sln

      - name: Build
        run: dotnet build EtAlii.Lark.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EtAlii.Lark.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Pack
        run: dotnet pack EtAlii.Lark.sln --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: |
            dotnet/artifacts/*.nupkg
            dotnet/artifacts/*.snupkg

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check that the bundled grammars match the .NET package's
        run: diff -r etalii-lark/grammars ../dotnet/src/EtAlii.Lark/Grammars

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked

      - name: Run the purchase order example
        run: cargo run --release --locked --example purchase_orders -p etalii-lark-derive

      - name: Package
        run: cargo package --locked --workspace --exclude codegen-tests

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install
        run: npm ci

      - name: Check that the bundled grammars match the .NET package's
        run: |
          npm run embed-grammars
          git diff --exit-code -- src/grammars.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: typescript/*.tgz
